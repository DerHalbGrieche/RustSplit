[package]
name = "rustsplit"
description = "A native Rust rewrite of LiveSplit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "rustsplit"

[[bin]]
name = "rustsplit"
path = "src/main.rs"

[features]
default = ["native-dialogs"]
# Use the platform's file dialogs (XDG desktop portal on Linux), falling back
# to the built-in egui browser when they are unavailable.
native-dialogs = ["dep:rfd", "dep:pollster"]

[dependencies]
rustsplit-core.workspace = true
rustsplit-ui.workspace = true
rustsplit-server.workspace = true

chrono.workspace = true
clap.workspace = true
directories.workspace = true
eframe.workspace = true
egui.workspace = true
env_logger.workspace = true
global-hotkey.workspace = true
image.workspace = true
log.workspace = true
pollster = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
