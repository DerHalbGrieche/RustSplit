[package]
name = "rustsplit"
description = "A native Rust rewrite of LiveSplit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "rustsplit"

[lints]
workspace = true

[[bin]]
name = "rustsplit"
path = "src/main.rs"

[features]
default = ["native-dialogs", "sounds", "speedrun-com"]
# Use the platform's file dialogs (XDG desktop portal on Linux), falling back
# to the built-in egui browser when they are unavailable.
native-dialogs = ["dep:rfd", "dep:pollster"]
# Fetch world records from speedrun.com for the World Record component. Still
# opt-in at runtime through settings.toml.
speedrun-com = ["dep:ureq"]
# Timer sound effects through rodio (needs ALSA on Linux).
sounds = ["dep:rodio"]

[dependencies]
rustsplit-core.workspace = true
rustsplit-ui.workspace = true
rustsplit-server.workspace = true

chrono.workspace = true
clap.workspace = true
directories.workspace = true
eframe.workspace = true
egui.workspace = true
env_logger.workspace = true
global-hotkey.workspace = true
image.workspace = true
log.workspace = true
pollster = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
rodio = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq = { workspace = true, optional = true }
